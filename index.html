<!doctype html>
<html lang="ko">

    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 외부 도메인 미리 연결 -->
    <link rel="preconnect" href="https://cdn.puzmu.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- LCP 이미지 선행 로드 (홈 히어로) — 홈 경로일 때만 preload -->
    <script>
      ;(function () {
        var p = location.pathname
        // "/", "/ko", "/en/", "/ja" 등 루트만 매칭
        if (p === '/' || /^\/(ko|en|ja)\/?$/.test(p)) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.href = 'https://cdn.puzmu.com/main.webp'
          l.fetchPriority = 'high'
          document.head.appendChild(l)
        }
      })()
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <meta name="naver-site-verification" content="dcbc007b33e402fc09c071350e980fb2b5cf4616" />

    <!-- 로컬 환경에서는 GTM / Clarity 로드 스킵 -->
    <script>
      window.__IS_LOCAL__ = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
    </script>

        ;(function (w, d, s, l, i) {
          w[l] = w[l] || []
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
          var f = d.getElementsByTagName(s)[0],

            dl = l != 'dataLayer' ? '&l=' + l : ''
          j.async = true
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
          f.parentNode.insertBefore(j, f)
        })(window, document, 'script', 'dataLayer', 'GTM-PWKFF5L4')
      }
    </script>
    <!-- End Google Tag Manager -->

    <!-- Clarity -->
    <script type="text/javascript">
      if (!window.__IS_LOCAL__) {
        ;(function (c, l, a, r, i, t, y) {

            c[a] ||

          t = l.createElement(r)
          t.async = 1
          t.src = 'https://www.clarity.ms/tag/' + i
          y = l.getElementsByTagName(r)[0]
          y.parentNode.insertBefore(t, y)
        })(window, document, 'clarity', 'script', 'tpl0ojzlna')
      }
    </script>

    <link rel="canonical" href="https://www.puzmu.com/ko/tangram" />

    <title>칠교놀이</title>
